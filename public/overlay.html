<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Auslosung Overlay</title>
  <style>
    :root { --accent: #9146ff; --bg: rgba(14,14,16,.88); --text: #fff; --muted: #c8c8d0; }
    body.light { --bg: rgba(255,255,255,.92); --text: #18181b; --muted: #53535f; }
    html, body { margin: 0; background: transparent; overflow: hidden; height: 100%; }
    body { font: 600 28px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); }
    .wrap { position: absolute; inset: 0; display: grid; place-items: center; }
    .card {
      background: var(--bg); border-radius: 22px; padding: 28px 40px; min-width: 560px; max-width: 80vw;
      text-align: center; border: 3px solid var(--accent); box-shadow: 0 10px 40px rgba(0,0,0,.4);
      transform: scale(.85); opacity: 0; transition: transform .4s cubic-bezier(.2,1.4,.4,1), opacity .3s;
    }
    .card.show { transform: scale(1); opacity: 1; }
    .title { font-size: 40px; font-weight: 800; }
    .prize { color: var(--accent); font-size: 32px; margin-top: 4px; filter: brightness(1.3); }
    .cta { margin-top: 18px; font-size: 30px; }
    .kw { background: var(--accent); color: #fff; padding: 2px 14px; border-radius: 10px; }
    .meta { margin-top: 14px; color: var(--muted); font-size: 24px; }
    .recent { margin-top: 14px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 40px; }
    .recent span { font-size: 18px; padding: 4px 12px; border-radius: 99px; background: rgba(127,127,127,.2); animation: pop .4s ease-out; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } }
    .reelbox { height: 90px; overflow: hidden; position: relative; margin: 18px 0 6px;
      mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
    .reel { position: absolute; left: 0; right: 0; top: 0; }
    .reel div { height: 90px; line-height: 90px; font-size: 56px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .winner-name { font-size: 64px; font-weight: 900; color: var(--accent); filter: brightness(1.3); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.05); } }
    .label { font-size: 26px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
    canvas { position: absolute; inset: 0; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>
  <div class="wrap"><div class="card" id="card"></div></div>
  <script src="/static/overlay.js"></script>
</body>
</html>
